{{- if and .Values.config.adminAddr (not .Values.existingSecret) (not .Values.secrets.adminToken) }}
{{- fail "config.adminAddr is set: provide secrets.adminToken (>=16 chars) or existingSecret" }}
{{- end }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mtp.secretName" . }}
  labels: {{- include "mtp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MTP_UPSTREAM_PASSWORD: {{ .Values.secrets.upstreamPassword | quote }}
  MTP_ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  MTP_APPNAME_SECRET: {{ .Values.secrets.appNameSecret | quote }}
{{- end }}
