name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without any commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.9.0
  GOSEC_VERSION: v2.29.0
  STATICCHECK_VERSION: v0.8.2
  GITLEAKS_VERSION: v8.30.1

jobs:
  govulncheck-source:
    name: govulncheck (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      # Exits non-zero only for vulnerabilities whose vulnerable symbol is reachable.
      - run: govulncheck ./...

  govulncheck-binary:
    name: govulncheck (binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: CGO_ENABLED=0 go build -trimpath -o bin/mongodb-tenant-proxy ./cmd/mongodb-tenant-proxy
      # Scans what actually ships: the compiled binary, including the stdlib version it was built with.
      - run: govulncheck -mode=binary bin/mongodb-tenant-proxy

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      - name: Scan (SARIF, never fails)
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: gosec.sarif
          category: gosec
      # Gate: medium and above fail the build. Low-severity G104 findings are
      # triaged best-effort cleanup (Close/SetDeadline); see SECURITY.md.
      - name: Gate
        run: gosec -severity medium ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
      - run: staticcheck ./...

  race:
    name: go test -race (whole suite)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Start MongoDB 8.0 replica set
        run: ./.github/scripts/start-mongo.sh 8.0
      - run: go test ./... -race -count=1 -timeout 30m
        env:
          MTP_MONGOD_URI: 127.0.0.1:27017

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan history, not just the tip
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # The CLI is used instead of gitleaks-action, which needs a paid licence key on organisation repos.
      - run: go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
      - run: gitleaks git --config .gitleaks.toml --redact --verbose .

  trivy-fs:
    name: trivy (dependencies, Dockerfile, Helm chart)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Vulnerabilities in go.mod
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Misconfiguration in Dockerfile, Helm chart and compose/systemd files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-config: trivy.yaml

  trivy-image:
    name: trivy (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t mongodb-tenant-proxy:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mongodb-tenant-proxy:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
