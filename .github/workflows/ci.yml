name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - run: go vet ./...
      - run: go build ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - run: go test ./internal/... -race -count=1

  # Integration tests against a real single-node replica set, per MongoDB
  # version. The harness uses the container via MTP_MONGOD_URI; the one test
  # group that needs an auth-enabled upstream skips itself in this mode; it
  # still runs on developer machines with a local mongod.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["5.0", "6.0", "7.0", "8.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Start MongoDB ${{ matrix.mongo }} replica set
        run: ./.github/scripts/start-mongo.sh ${{ matrix.mongo }}
      - run: go test ./test/ -race -count=1 -timeout 20m
        env:
          MTP_MONGOD_URI: 127.0.0.1:27017

  compat:
    runs-on: ubuntu-latest
    needs: vet
    strategy:
      fail-fast: false
      matrix:
        lang: [mongosh, node, python, java]
        mongo: ["5.0", "6.0", "7.0", "8.0"]
    name: compat (${{ matrix.lang }}, mongo ${{ matrix.mongo }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.lang == 'node' || matrix.lang == 'mongosh'
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.lang == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: test/compat/java/pom.xml
      - name: Install mongosh
        if: matrix.lang == 'mongosh'
        run: npm install -g mongosh
      - name: Start MongoDB ${{ matrix.mongo }} replica set
        run: ./.github/scripts/start-mongo.sh ${{ matrix.mongo }}
      - name: Compat suite
        env:
          MTP_MONGO_ADDR: 127.0.0.1:27017
          COMPAT_MONGO_VERSION: ${{ matrix.mongo }}
        run: ./test/compat/run.sh ${{ matrix.lang }}
